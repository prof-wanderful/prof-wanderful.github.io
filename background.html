<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <!-- Character encoding declaration -->
  <title>Interactive Particle Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    // Set canvas size to match the window size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const numParticles = 400;

    for (let i = 0; i < numParticles; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 5 + 1,
        speedX: Math.random() * 3 - 1.5,
        speedY: Math.random() * 3 - 1.5,
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(particles[i].x, particles[i].y, particles[i].size, 0, Math.PI * 2);
        ctx.fill();

        particles[i].x += particles[i].speedX;
        particles[i].y += particles[i].speedY;

        if (particles[i].x > canvas.width) {
          particles[i].x = 0;
        }
        if (particles[i].x < 0) {
          particles[i].x = canvas.width;
        }
        if (particles[i].y > canvas.height) {
          particles[i].y = 0;
        }
        if (particles[i].y < 0) {
          particles[i].y = canvas.height;
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

    canvas.addEventListener('mousemove', (e) => {
      for (let i = 0; i < particles.length; i++) {
        const dx = e.clientX - particles[i].x;
        const dy = e.clientY - particles[i].y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 50) {
          particles[i].speedX = dx * 0.05;
          particles[i].speedY = dy * 0.05;
        }
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>

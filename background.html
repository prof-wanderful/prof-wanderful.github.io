<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Particle Animation</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    const particles = [];
    const numParticles = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticles() {
      particles.length = 0;

      for (let i = 0; i < numParticles; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 3 + 1,
          speedX: Math.random() - 0.6,
          speedY: Math.random() - 0.6
        });
      }
    }

    function animate() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        const particle = particles[i];

        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();

        particle.x += particle.speedX;
        particle.y += particle.speedY;

        if (particle.x > canvas.width) particle.x = 0;
        if (particle.x < 0) particle.x = canvas.width;
        if (particle.y > canvas.height) particle.y = 0;
        if (particle.y < 0) particle.y = canvas.height;
      }

      requestAnimationFrame(animate);
    }

    function interactWithPointer(mouseX, mouseY) {
      for (let i = 0; i < particles.length; i++) {
        const particle = particles[i];
        const dx = mouseX - particle.x;
        const dy = mouseY - particle.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 50) {
          particle.speedX = dx * 0.005;
          particle.speedY = dy * 0.005;
        }
      }
    }

    resizeCanvas();
    createParticles();
    animate();

    // Works when background.html is opened by itself.
    window.addEventListener('pointermove', (event) => {
      interactWithPointer(event.clientX, event.clientY);
    }, { passive: true });

    // Main website pages send pointer coordinates here.
    window.addEventListener('message', (event) => {
      const data = event.data;

      if (!data || data.type !== 'starfield-pointer') return;

      // When framed, only accept pointer messages from the parent page.
      if (window.parent !== window && event.source !== window.parent) return;

      if (Number.isFinite(data.x) && Number.isFinite(data.y)) {
        interactWithPointer(data.x, data.y);
      }
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
